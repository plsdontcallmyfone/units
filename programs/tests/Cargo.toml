[package]
name = "bordrless-program-tests"
description = "LiteSVM host tests for the Bordrless programs; they load the .so files built by scripts/solana/programs.sh build."
version.workspace = true
edition.workspace = true
publish.workspace = true

# Host-only: no cdylib target, so cargo build-sbf never builds this crate.
[dependencies]
anchor-lang.workspace = true
litesvm.workspace = true
bordrless-core = { path = "../../crates/bordrless-core" }
bordrless-hook = { path = "../../crates/bordrless-hook" }
bordrless-token = { path = "../bordrless_token", features = ["no-entrypoint"] }
bordrless-swap = { path = "../bordrless_swap", features = ["no-entrypoint"] }
bordrless-bridge = { path = "../bordrless_bridge", features = ["no-entrypoint"] }
bordrless-launch = { path = "../bordrless_launch", features = ["no-entrypoint"] }
bordrless-kit = { path = "../bordrless_kit", features = ["no-entrypoint"] }
tax-hook = { path = "../tax_hook", features = ["no-entrypoint"] }
half-life = { path = "../half_life", features = ["no-entrypoint"] }
bordrless-companion = { path = "../bordrless_companion", features = ["no-entrypoint"] }
hook-tester = { path = "../hook_tester", features = ["no-entrypoint"] }
# Hookwars: test-only slot programs.
slot-tester = { path = "../slot_tester", features = ["no-entrypoint"] }
armory-stub = { path = "../armory_stub", features = ["no-entrypoint"] }
# Hookwars M2: the armory, the items program and their test-only callers.
hookwars-common = { path = "../../crates/hookwars-common" }
hookwars-armory = { path = "../hookwars_armory", features = ["no-entrypoint"] }
hookwars-items = { path = "../hookwars_items", features = ["no-entrypoint"] }
launch-stub = { path = "../launch_stub", features = ["no-entrypoint"] }
war-stub = { path = "../war_stub", features = ["no-entrypoint"] }
# Hookwars: the war program and its test-only stand-ins.
hookwars-war = { path = "../hookwars_war", features = ["no-entrypoint"] }
war-items-stub = { path = "../war_items_stub", features = ["no-entrypoint"] }
war-armory-stub = { path = "../war_armory_stub", features = ["no-entrypoint"] }
randomness-stub = { path = "../randomness_stub", features = ["no-entrypoint"] }
pool-item-stub = { path = "../pool_item_stub", features = ["no-entrypoint"] }
items-stub = { path = "../items_stub", features = ["no-entrypoint"] }
# Hookwars expansion (10): market and social.
hookwars-market = { path = "../hookwars_market", features = ["no-entrypoint"] }
hookwars-social = { path = "../hookwars_social", features = ["no-entrypoint"] }
solana-account = "=4.7.0"
solana-hash.workspace = true
solana-keypair.workspace = true
solana-message = { workspace = true, features = ["wincode"] }
solana-rent.workspace = true
solana-signature.workspace = true
solana-signer.workspace = true
solana-transaction = { workspace = true, features = ["wincode"] }

[lints]
workspace = true
