[package]
name = "items-stub"
description = "Hookwars, test-only, never deployed: loaded at the items program id in the LiteSVM suites, it signs as any items PDA by CPI to the token program (R20, R24 tests)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "items_stub"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "bordrless-token/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true }
bordrless-token = { path = "../bordrless_token", features = ["no-entrypoint"] }

[lints]
workspace = true
