[package]
name = "war-items-stub"
description = "Hookwars, test-only, never deployed: loaded at the items program id in the war suites. It answers the Raid item's war touches (04 section 2.10) and declares the RaidLedger layout (04 section 2.9) so the suites write ledgers with Anchor's own discriminator."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "war_items_stub"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "bordrless-hook/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true }
bordrless-hook = { path = "../../crates/bordrless-hook" }

[lints]
workspace = true
