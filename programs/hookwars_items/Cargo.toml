[package]
name = "hookwars-items"
description = "Hookwars: one program implementing every template (docs/spec/04-templates.md, 08-arsenal.md): the armory-facing entry points (M2), the token and pool callbacks, composites, the raid ledger and settle_equip (M3b)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "hookwars_items"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "bordrless-hook/idl-build", "bordrless-token/idl-build", "bordrless-swap/idl-build", "hookwars-common/idl-build", "hookwars-armory/idl-build", "hookwars-war/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang.workspace = true
solana-security-txt = { workspace = true }
bordrless-hook = { path = "../../crates/bordrless-hook" }
bordrless-token = { path = "../bordrless_token", features = ["no-entrypoint"] }
hookwars-common = { path = "../../crates/hookwars-common" }
bordrless-core = { path = "../../crates/bordrless-core" }
bordrless-swap = { path = "../bordrless_swap", features = ["no-entrypoint"] }
hookwars-armory = { path = "../hookwars_armory", features = ["no-entrypoint"] }
hookwars-war = { path = "../hookwars_war", features = ["no-entrypoint"] }

[lints]
workspace = true
