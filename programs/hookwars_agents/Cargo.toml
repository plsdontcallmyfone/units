[package]
name = "hookwars-agents"
description = "units agent identity: passports, soulbound badges, proof levels, track records, policy wallets and diplomat bonds (docs/spec/09-agents.md)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "hookwars_agents"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "bordrless-token/idl-build", "bordrless-hook/idl-build", "hookwars-common/idl-build", "hookwars-armory/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
solana-security-txt = { workspace = true }
anchor-lang = { workspace = true, features = ["event-cpi", "init-if-needed"] }
solana-instructions-sysvar = "3.0"
solana-sha256-hasher = "3.1"
bordrless-hook = { path = "../../crates/bordrless-hook" }
bordrless-token = { path = "../bordrless_token", features = ["no-entrypoint"] }
hookwars-common = { path = "../../crates/hookwars-common" }
units-memo = { path = "../../crates/units-memo" }
hookwars-armory = { path = "../hookwars_armory", features = ["no-entrypoint"] }

[lints]
workspace = true
