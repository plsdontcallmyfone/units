[package]
name = "launch-stub"
description = "Hookwars, test-only, never deployed: declared at the launchpad's id, it calls the armory signing as [\"armory-caller\", mint] (the real launchpad does in M3)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "launch_stub"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true }

[lints]
workspace = true
