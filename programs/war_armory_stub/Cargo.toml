[package]
name = "war-armory-stub"
description = "Hookwars, test-only, never deployed: loaded at the armory program id in the war suites. It accepts mint_loot from the war program's loot signer only and records what it was asked, and declares the Item, Template and ForgeCounter layouts (02 sections 2.3, 2.4, 2.10)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "war_armory_stub"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true }

[lints]
workspace = true
