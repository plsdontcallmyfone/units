[package]
name = "armory-stub"
description = "Hookwars, test-only, never deployed: loaded at the armory program id in the LiteSVM suites, it signs as a mint's [\"slots\", mint] PDA by CPI (the real armory is not built yet)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "armory_stub"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "bordrless-token/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true }
bordrless-token = { path = "../bordrless_token", features = ["no-entrypoint"] }

[lints]
workspace = true
