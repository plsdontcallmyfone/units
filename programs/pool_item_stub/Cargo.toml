[package]
name = "pool-item-stub"
description = "Hookwars, test-only, never deployed: a pool item (pool_before_swap / pool_after_swap) whose answers a test scripts per item, recording what each callback was told. Stands in for hookwars_items' pool callbacks until M3b integration."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "pool_item_stub"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "bordrless-hook/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true }
bordrless-hook = { path = "../../crates/bordrless-hook" }

[lints]
workspace = true
