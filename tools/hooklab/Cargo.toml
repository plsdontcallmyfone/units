[package]
name = "hooklab"
description = "units Hook Lab: checks an external hook template (manifest, build, LiteSVM property suite against the real token program), signs a report and prints its register_template instruction."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "hooklab"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anchor-lang.workspace = true
bordrless-program-tests = { path = "../../programs/tests" }
bordrless-hook = { path = "../../crates/bordrless-hook" }
bordrless-token = { path = "../../programs/bordrless_token", features = ["no-entrypoint"] }
hookwars-armory = { path = "../../programs/hookwars_armory", features = ["no-entrypoint"] }
hookwars-common = { path = "../../crates/hookwars-common" }
solana-account.workspace = true
solana-keypair.workspace = true
solana-signature = { workspace = true, features = ["verify"] }
solana-signer.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[lints]
workspace = true
