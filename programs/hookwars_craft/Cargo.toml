[package]
name = "hookwars-craft"
description = "Hookwars (units): materials, capped drops from verified activity, recipes, repairs and item wear (docs/spec/11-hook-economy.md section 5)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "hookwars_craft"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "bordrless-token/idl-build", "hookwars-common/idl-build", "hookwars-armory/idl-build", "hookwars-social/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang.workspace = true
solana-security-txt = { workspace = true }
bordrless-token = { path = "../bordrless_token", features = ["no-entrypoint"] }
bordrless-hook = { path = "../../crates/bordrless-hook" }
hookwars-common = { path = "../../crates/hookwars-common" }
hookwars-armory = { path = "../hookwars_armory", features = ["no-entrypoint"] }
hookwars-social = { path = "../hookwars_social", features = ["no-entrypoint"] }

[lints]
workspace = true
