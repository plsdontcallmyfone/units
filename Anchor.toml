# Anchor workspace for the Bordrless programs. The programs are built with `cargo build-sbf`
# (scripts/solana/programs.sh); the Anchor CLI is used for `anchor idl build` only. Tests are Rust
# LiteSVM tests (programs/tests), so no local validator is started.
skip_local_validator = true

[toolchain]
anchor_version = "1.2.0"
solana_version = "4.3.0"
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[workspace]
members = [
  "programs/bordrless_token",
  "programs/bordrless_swap",
  "programs/bordrless_bridge",
  "programs/bordrless_launch",
  "programs/bordrless_kit",
  "programs/tax_hook",
  "programs/half_life",
  "programs/bordrless_companion",
  "programs/hook_tester",
  "programs/slot_tester",
  "programs/armory_stub",
  "programs/launch_stub",
  "programs/war_stub",
  "programs/hookwars_armory",
  "programs/hookwars_items",
  "programs/hookwars_war",
  "programs/war_items_stub",
  "programs/war_armory_stub",
  "programs/randomness_stub",
]

# One set of program IDs on every cluster (generated 2026-10-07; the keypairs are kept off the repo,
# see keys/README.md). hook_tester is a test-only program for the LiteSVM suites: it is never
